name: Desplegar en GitHub Pages

# El sitio se sirve desde la rama gh-pages (Pages se activó automáticamente
# al crearla). Este workflow mantiene gh-pages sincronizada con main:
# cada push a main publica la web sin pasos manuales.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar main en gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git push --force origin gh-pages
