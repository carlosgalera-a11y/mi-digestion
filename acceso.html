<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso profesionales | Mi Digestión</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div class="card" style="max-width:460px;margin:32px auto">
    <div style="text-align:center">
      <div style="font-size:2.4rem" aria-hidden="true">🩺</div>
      <h1 style="margin:6px 0">Área de profesionales</h1>
      <p class="hint">Acceso exclusivo para profesionales autorizados de la consulta de digestivo.</p>
    </div>

    <form id="form-email">
      <label class="field-label" for="email">Tu correo profesional</label>
      <input type="email" id="email" autocomplete="email" required style="width:100%"
             placeholder="nombre@ejemplo.com" inputmode="email">
      <div class="acciones" style="margin-top:12px">
        <button type="submit" class="btn primario" id="btn-enviar" style="width:100%">
          Enviar acceso por correo
        </button>
      </div>
    </form>

    <form id="form-codigo" hidden>
      <div class="aviso info" style="margin-top:0">
        Te hemos enviado un correo a <strong id="email-eco"></strong>.
        Ábrelo y <strong>haz clic en el enlace</strong>, o escribe aquí el <strong>código de 6 dígitos</strong>.
      </div>
      <label class="field-label" for="codigo">Código de 6 dígitos</label>
      <input type="text" id="codigo" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]*" maxlength="6" style="width:100%;letter-spacing:0.3em;font-size:1.2rem;text-align:center"
             placeholder="000000">
      <div class="acciones" style="margin-top:12px">
        <button type="submit" class="btn primario" id="btn-verificar" style="width:100%">Entrar</button>
      </div>
      <div class="acciones">
        <button type="button" class="btn" id="btn-otro-correo" style="width:100%">Usar otro correo</button>
      </div>
    </form>

    <p id="mensaje" class="hint" aria-live="polite" style="text-align:center"></p>

    <hr style="border:0;border-top:1px solid var(--grid);margin:16px 0">
    <p class="hint" style="text-align:center;margin:0">
      <a href="index.html">← Volver a la app pública</a>
    </p>
  </div>
</main>

<script src="js/vendor/supabase.js"></script>
<script type="module" src="js/acceso.js"></script>
</body>
</html>
